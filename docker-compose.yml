version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    ports:
      - "8761:8761"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_started

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: main_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      EUREKA_URI: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_started
      postgres:
        condition: service_healthy

  post-service:
    build:
      context: .
      dockerfile: post-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: main_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      EUREKA_URI: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_started
      postgres:
        condition: service_healthy

  comment-service:
    build:
      context: .
      dockerfile: comment-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: main_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      EUREKA_URI: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_started
      postgres:
        condition: service_healthy

  like-dislike-service:
    build:
      context: .
      dockerfile: like-dislike-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: main_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      EUREKA_URI: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_started
      postgres:
        condition: service_healthy

  tag-service:
    build:
      context: .
      dockerfile: tag-service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: main_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      EUREKA_URI: http://eureka-server:8761/eureka/
      EUREKA_HOST: eureka-server
    depends_on:
      eureka-server:
        condition: service_started
      postgres:
        condition: service_healthy
