apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: blog
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword }}
  POSTGRES_DB: {{ .Values.secrets.postgresDb }}

---

apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: blog
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret }}
