apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      containers:
        - name: tempo
          image: {{ .Values.tempo.image }}
          args: ["-config.file=/etc/tempo.yaml"]
          ports:
            - containerPort: {{ .Values.tempo.port }}
            - containerPort: {{ .Values.tempo.otlpGrpcPort }}
            - containerPort: {{ .Values.tempo.otlpHttpPort }}
          volumeMounts:
            - name: tempo-config
              mountPath: /etc/tempo.yaml
              subPath: tempo.yaml
          readinessProbe:
            tcpSocket:
              port: {{ .Values.tempo.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tempo-config
          configMap:
            name: tempo-config
