apiVersion: apps/v1
kind: Deployment
metadata:
  name: like-dislike-service
  namespace: blog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: like-dislike-service
  template:
    metadata:
      labels:
        app: like-dislike-service
    spec:
      containers:
        - name: like-dislike-service
          image: {{ .Values.likeDislikeService.image }}
          imagePullPolicy: Never
          ports:
            - containerPort: {{ .Values.likeDislikeService.port }}
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: jwt-secret
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.likeDislikeService.port }}
            initialDelaySeconds: 25
            periodSeconds: 10
