apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: 'microservices'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets:
              - 'api-gateway:{{ .Values.apiGateway.port }}'
              - 'user-service:{{ .Values.userService.port }}'
              - 'post-service:{{ .Values.postService.port }}'
              - 'comment-service:{{ .Values.commentService.port }}'
              - 'like-dislike-service:{{ .Values.likeDislikeService.port }}'
              - 'tag-service:{{ .Values.tagService.port }}'
        relabel_configs:
          - source_labels: [__address__]
            regex: '([^:]+):.*'
            target_label: application
            replacement: '$1'
