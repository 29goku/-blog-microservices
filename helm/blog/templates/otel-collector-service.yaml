apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: {{ .Values.otelCollector.otlpGrpcPort }}
      targetPort: {{ .Values.otelCollector.otlpGrpcPort }}
    - name: otlp-http
      port: {{ .Values.otelCollector.otlpHttpPort }}
      targetPort: {{ .Values.otelCollector.otlpHttpPort }}
