databases:
  - name: main-db
    databaseName: main_db
    plan: free

services:
  # ─────────────────────────────────────────
  # Eureka Service Discovery
  # ─────────────────────────────────────────
  - type: web
    name: eureka-server
    runtime: docker
    dockerfilePath: ./eureka-server/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8761

  # ─────────────────────────────────────────
  # API Gateway
  # ─────────────────────────────────────────
  - type: web
    name: api-gateway
    runtime: docker
    dockerfilePath: ./api-gateway/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: EUREKA_CLIENT_ENABLED
        value: "false"
      - key: EUREKA_REGISTER
        value: "false"
      - key: EUREKA_FETCH
        value: "false"
      - key: GATEWAY_DISCOVERY_ENABLED
        value: "false"
      - key: USER_SERVICE_URL
        value: https://user-service-gntw.onrender.com
      - key: POST_SERVICE_URL
        value: https://post-service-7g3r.onrender.com
      - key: COMMENT_SERVICE_URL
        value: https://comment-service-edye.onrender.com
      - key: LIKE_DISLIKE_SERVICE_URL
        value: https://like-dislike-service.onrender.com
      - key: TAG_SERVICE_URL
        value: https://tag-service-d5s9.onrender.com

  # ─────────────────────────────────────────
  # User Service
  # ─────────────────────────────────────────
  - type: web
    name: user-service
    runtime: docker
    dockerfilePath: ./user-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8081
      - key: DB_HOST
        fromDatabase:
          name: main-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: main-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: main-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: main-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: main-db
          property: password
      - key: EUREKA_CLIENT_ENABLED
        value: "false"
      - key: EUREKA_REGISTER
        value: "false"
      - key: EUREKA_FETCH
        value: "false"

  # ─────────────────────────────────────────
  # Post Service
  # ─────────────────────────────────────────
  - type: web
    name: post-service
    runtime: docker
    dockerfilePath: ./post-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8082
      - key: DB_HOST
        fromDatabase:
          name: main-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: main-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: main-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: main-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: main-db
          property: password
      - key: EUREKA_CLIENT_ENABLED
        value: "false"
      - key: EUREKA_REGISTER
        value: "false"
      - key: EUREKA_FETCH
        value: "false"
      - key: USER_SERVICE_URL
        value: https://user-service-gntw.onrender.com

  # ─────────────────────────────────────────
  # Comment Service
  # ─────────────────────────────────────────
  - type: web
    name: comment-service
    runtime: docker
    dockerfilePath: ./comment-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8083
      - key: DB_HOST
        fromDatabase:
          name: main-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: main-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: main-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: main-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: main-db
          property: password
      - key: EUREKA_CLIENT_ENABLED
        value: "false"
      - key: EUREKA_REGISTER
        value: "false"
      - key: EUREKA_FETCH
        value: "false"
      - key: USER_SERVICE_URL
        value: https://user-service-gntw.onrender.com
      - key: POST_SERVICE_URL
        value: https://post-service-7g3r.onrender.com

  # ─────────────────────────────────────────
  # Like-Dislike Service
  # ─────────────────────────────────────────
  - type: web
    name: like-dislike-service
    runtime: docker
    dockerfilePath: ./like-dislike-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8084
      - key: DB_HOST
        fromDatabase:
          name: main-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: main-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: main-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: main-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: main-db
          property: password
      - key: EUREKA_CLIENT_ENABLED
        value: "false"
      - key: EUREKA_REGISTER
        value: "false"
      - key: EUREKA_FETCH
        value: "false"
      - key: USER_SERVICE_URL
        value: https://user-service-gntw.onrender.com
      - key: POST_SERVICE_URL
        value: https://post-service-7g3r.onrender.com

  # ─────────────────────────────────────────
  # Tag Service
  # ─────────────────────────────────────────
  - type: web
    name: tag-service
    runtime: docker
    dockerfilePath: ./tag-service/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8085
      - key: DB_HOST
        fromDatabase:
          name: main-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: main-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: main-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: main-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: main-db
          property: password
      - key: EUREKA_CLIENT_ENABLED
        value: "false"
      - key: EUREKA_REGISTER
        value: "false"
      - key: EUREKA_FETCH
        value: "false"
